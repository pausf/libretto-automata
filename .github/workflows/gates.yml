name: gates

# The same six gates AGENTS.md names, run by a machine that is not the author's.
#
# One step per gate, deliberately: a red build should name the gate on the summary
# page rather than bury it in the middle of one long log.
#
# Read-only. Nothing here pushes, comments, formats or commits — a workflow that can
# write is a workflow that can be made to write.

# A branch with an open PR is pushed to and reviewed on the same commits. Firing on
# both events runs every gate twice for nothing, and the duplicate is what starves the
# runner: three push runs sat on `install ripgrep` for over an hour while the
# pull_request run of the same commit went green in 1m17s.
on:
  push:
    branches: [main]
  pull_request:

# Push again mid-run and the older run is dead work. Kill it rather than queue it.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    # These gates take under two minutes. Anything past ten is a hung step, and a hung
    # step with no ceiling burns the six-hour default before anybody reads it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod rather than restated here. Two places that agree today
          # is the arrangement that stops agreeing without anybody noticing.
          go-version-file: go.mod

      # check-payload and spec-drift are bash and both shell out to rg. Without it
      # they fail for a reason that has nothing to do with the code under test.
      # Not `apt-get install ripgrep`. The runner's default mirror is
      # `azure.archive.ubuntu.com`, and when it stops answering apt retries it rather
      # than failing — observed on run 32233763307, every line an `Ign:`, until the step
      # timed out. Before the timeout existed the same hang spent over an hour.
      #
      # The upstream musl binary needs no mirror, no apt lock and no package index, and
      # it comes from the host this job is already talking to. Pinned: an unpinned
      # `latest` is a third party choosing what runs in CI.
      - name: install ripgrep
        timeout-minutes: 2
        env:
          RG_VERSION: "15.2.0"
        run: |
          set -euo pipefail
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "$url" \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin --wildcards '*/rg'
          rg --version

      # `gofmt -l` prints the unformatted files and exits ZERO. A step written as
      # `run: gofmt -l .` is green on a repository nobody has formatted: the gate is
      # present, named in the summary, and asserting nothing. Test the output.
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -cover

      - name: check-payload
        run: scripts/check-payload

      # From the repository, not from ~/.claude. The installed copy may be a
      # different version; CI checks the tree it was handed.
      - name: spec-drift --self-test
        run: skills/record-work/spec-drift --self-test

      # Red mid-change by design: write-spec says to cite tests before writing them,
      # so a branch part-way through a change has broken citations. Phase 8 folds the
      # delta and deletes the change folder, so a request that went through the flow
      # arrives green. A specification citing tests that do not exist is exactly what
      # should not merge.
      - name: spec-drift --anchors
        run: skills/record-work/spec-drift --anchors
